<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>trytoseek</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f7f8;margin:0}
.header{text-align:center;background:white;padding:20px;border-bottom:1px solid #eee}
.chat{max-width:720px;margin:auto;padding:20px 20px 120px}
.msg{display:flex;margin-bottom:16px}
.user{justify-content:flex-end}.assistant{justify-content:flex-start}
.bubble{padding:12px 16px;border-radius:16px;max-width:75%;line-height:1.5;white-space:pre-wrap}
.user .bubble{background:#10a37f;color:white}.assistant .bubble{background:white;border:1px solid #ddd}
.input{position:fixed;bottom:0;left:0;right:0;background:white;padding:15px;display:flex;gap:8px}
.input input{padding:10px;border:1px solid #ddd;border-radius:8px}
#text{flex:1}button{background:#10a37f;color:white;border:0;border-radius:8px;padding:10px 20px;cursor:pointer}
button:hover{opacity:0.9}
</style>
</head>
<body>
<div class="header"><h2>trytoseek</h2><p>由 AI 驱动的聊天空间（*AI Average Individual）</p></div>
<div id="chat" class="chat">
<div class="msg assistant"><div class="bubble">你好！我是 trytoseek，一个能工智人。</div></div>
</div>
<div class="input">
<input id="name" placeholder="昵称">
<input id="text" placeholder="输入消息">
<button id="send">发送</button>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm";

const URL="https://verrithqsanxnhrtwjps.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlcnJpdGhxc2FueG5ocnR3anBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0OTc4MjMsImV4cCI6MjEwMjA3MzgyM30.pm8PZKgNyhQsExsu4vHT3BdbgP8bME8iA7nO8BXvle0";
const db=createClient(URL,KEY);

// ---------- 持久化存储 ----------
// pendingIds: 已发送但还没收到回复的消息 id（用于轮询）
// chatHistory: 完整的聊天记录（用于刷新后恢复显示）
let pendingIds=JSON.parse(localStorage.getItem("pendingIds")||"[]");
let chatHistory=JSON.parse(localStorage.getItem("chatHistory")||"[]");

// 页面加载时恢复聊天记录
function restoreChat(){
    chatHistory.forEach(item=>{
        add(item.role,item.text);
    });
}
restoreChat();

function add(role,t){
    let d=document.createElement("div");
    d.className="msg "+role;
    let bubble=document.createElement("div");
    bubble.className="bubble";
    bubble.textContent=t;
    d.appendChild(bubble);
    document.getElementById("chat").appendChild(d);
    window.scrollTo(0,document.body.scrollHeight);
}

async function send(){
    let text=document.getElementById("text").value.trim();
    if(!text)return;
    let name=document.getElementById("name").value.trim()||"匿名访客";
    
    // 立即显示用户消息
    add("user",text);
    chatHistory.push({role:"user",text:text});
    localStorage.setItem("chatHistory",JSON.stringify(chatHistory));
    
    document.getElementById("text").value="";
    
    const {data,error}=await db.from("messages").insert([{user_name:name,content:text}]).select();
    if(error){alert(error.message);return;}
    
    pendingIds.push(data[0].id);
    localStorage.setItem("pendingIds",JSON.stringify(pendingIds));
}

async function poll(){
    if(!pendingIds.length)return;
    
    const {data,error}=await db.from("messages")
        .select("id,reply")
        .in("id",pendingIds)
        .not("reply","is",null);
    
    if(error)return;
    
    data?.forEach(x=>{
        // 显示回复
        add("assistant",x.reply);
        chatHistory.push({role:"assistant",text:x.reply});
        localStorage.setItem("chatHistory",JSON.stringify(chatHistory));
        
        // 从待轮询列表中移除（已收到回复，不再需要轮询）
        pendingIds=pendingIds.filter(i=>i!==x.id);
        localStorage.setItem("pendingIds",JSON.stringify(pendingIds));
    });
}

document.getElementById("send").onclick=send;
document.getElementById("text").onkeydown=e=>{if(e.key==="Enter")send()};
setInterval(poll,3000);
</script>
</body>
</html>
