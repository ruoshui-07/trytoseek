<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<title>trytoseek</title>

<style>

body{
font-family:Arial;
background:#f7f7f8;
}

.box{
max-width:700px;
margin:auto;
}

.msg{
padding:12px;
margin:10px;
border-radius:15px;
}

.user{
background:#10a37f;
color:white;
text-align:right;
}

.ai{
background:white;
}

.input{
position:fixed;
bottom:20px;
width:80%;
}

</style>

</head>


<body>


<div class="box" id="chat">

<div class="msg ai">
你好，我是trytoseek
</div>

</div>


<input id="text"
placeholder="输入消息">


<button onclick="send()">
发送
</button>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>



<script>


let uid=
localStorage.getItem("uid");


if(!uid){

uid=crypto.randomUUID();

localStorage.setItem(
"uid",
uid
);

}




function add(type,text){

let div=document.createElement("div");

div.className="msg "+type;

div.innerText=text;


document.querySelector("#chat")
.appendChild(div);

}




async function send(){


let input=
document.querySelector("#text");


let text=input.value.trim();


if(!text)return;


add(
"user",
text
);


input.value="";



let {data,error}=

await supabaseClient
.from("messages")
.insert({

id:crypto.randomUUID(),

user_id:uid,

user_name:"访客",

content:text

})
.select();



if(error){

console.log(error);

alert(error.message);

}



}



</script>


</body>


</html>
