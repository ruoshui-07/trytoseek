<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>trytoseek - 登录</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f7f8;margin:0}
.header{text-align:center;background:white;padding:20px;border-bottom:1px solid #eee}
.chat{max-width:720px;margin:auto;padding:20px 20px 160px}
.msg{display:flex;margin-bottom:16px}
.user{justify-content:flex-end}.assistant{justify-content:flex-start}
.bubble{padding:12px 16px;border-radius:16px;max-width:75%;line-height:1.5}
.user .bubble{background:#10a37f;color:white}.assistant .bubble{background:white;border:1px solid #ddd}
.input{position:fixed;bottom:0;left:0;right:0;background:white;padding:15px;display:flex;gap:8px;flex-wrap:wrap}
.input input{padding:10px;border:1px solid #ddd;border-radius:8px;flex:1}
#name{max-width:150px}
button{background:#10a37f;color:white;border:0;border-radius:8px;padding:10px 20px;cursor:pointer}
.auth-box{max-width:400px;margin:40px auto;padding:20px;background:white;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,0.1)}
.auth-box h2{text-align:center}
.auth-box input{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:6px;box-sizing:border-box}
.auth-box button{width:100%;margin-top:10px}
.toggle-link{text-align:center;margin-top:12px;color:#10a37f;cursor:pointer}
</style>
</head>
<body>
<div class="header"><h2>trytoseek</h2><p>由 AI 驱动的聊天空间</p></div>

<!-- 登录/注册区域 -->
<div id="authArea" class="auth-box">
  <h2 id="authTitle">登录</h2>
  <input id="authEmail" type="email" placeholder="邮箱">
  <input id="authPassword" type="password" placeholder="密码">
  <button id="authSubmit">登录</button>
  <div class="toggle-link" id="toggleAuth">没有账号？注册</div>
  <div id="authMessage" style="color:red;margin-top:8px"></div>
</div>

<!-- 聊天区域（初始隐藏） -->
<div id="chatArea" style="display:none">
  <div id="chat" class="chat"></div>
  <div class="input">
    <input id="name" placeholder="昵称（可选）">
    <input id="text" placeholder="输入消息">
    <button id="send">发送</button>
  </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm";

const URL = "https://verrithqsanxnhrtwjps.supabase.co";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlcnJpdGhxc2FueG5ocnR3anBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0OTc4MjMsImV4cCI6MjEwMjA3MzgyM30.pm8PZKgNyhQsExsu4vHT3BdbgP8bME8iA7nO8BXvle0";
const supabase = createClient(URL, KEY);

// ---------- DOM 元素 ----------
const authArea = document.getElementById("authArea");
const chatArea = document.getElementById("chatArea");
const authTitle = document.getElementById("authTitle");
const authEmail = document.getElementById("authEmail");
const authPassword = document.getElementById("authPassword");
const authSubmit = document.getElementById("authSubmit");
const toggleLink = document.getElementById("toggleAuth");
const authMessage = document.getElementById("authMessage");
const chatDiv = document.getElementById("chat");
const nameInput = document.getElementById("name");
const textInput = document.getElementById("text");
const sendBtn = document.getElementById("send");

let isRegister = false; // 当前是注册模式还是登录模式
let currentUser = null;

// ---------- 辅助函数 ----------
function escapeHtml(t) {
  const e = document.createElement("div");
  e.textContent = t;
  return e.innerHTML;
}

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
  chatDiv.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
}

// 从 localStorage 恢复聊天记录
function restoreChatHistory() {
  const saved = localStorage.getItem("chatHistory");
  if (saved) {
    try {
      const msgs = JSON.parse(saved);
      msgs.forEach(m => addMessage(m.role, m.text));
    } catch (e) {}
  }
}

// 保存聊天记录到 localStorage
function saveChatHistory(role, text) {
  let history = [];
  const saved = localStorage.getItem("chatHistory");
  if (saved) try { history = JSON.parse(saved); } catch(e) {}
  history.push({ role, text });
  localStorage.setItem("chatHistory", JSON.stringify(history));
}

// ---------- 登录/注册 ----------
async function handleAuth() {
  const email = authEmail.value.trim();
  const password = authPassword.value.trim();
  if (!email || !password) {
    authMessage.textContent = "请填写邮箱和密码";
    return;
  }
  authMessage.textContent = "";
  authSubmit.disabled = true;
  authSubmit.textContent = "处理中...";

  try {
    let result;
    if (isRegister) {
      result = await supabase.auth.signUp({ email, password });
    } else {
      result = await supabase.auth.signInWithPassword({ email, password });
    }

    if (result.error) {
      authMessage.textContent = result.error.message;
      authSubmit.disabled = false;
      authSubmit.textContent = isRegister ? "注册" : "登录";
      return;
    }

    // 注册成功后自动登录（confirm email 关闭的情况下）
    if (isRegister && result.data.user) {
      // 注册成功，自动登录
      await supabase.auth.signInWithPassword({ email, password });
    }

    currentUser = result.data.user;
    if (!currentUser) {
      // 可能是需要确认邮箱，提示用户
      authMessage.textContent = "注册成功，请检查邮箱确认后登录";
      authSubmit.disabled = false;
      authSubmit.textContent = "注册";
      return;
    }

    // 登录成功，切换界面
    authArea.style.display = "none";
    chatArea.style.display = "block";
    initChat();
  } catch (err) {
    authMessage.textContent = err.message;
  } finally {
    authSubmit.disabled = false;
    authSubmit.textContent = isRegister ? "注册" : "登录";
  }
}

// 切换登录/注册
toggleLink.addEventListener("click", () => {
  isRegister = !isRegister;
  authTitle.textContent = isRegister ? "注册" : "登录";
  authSubmit.textContent = isRegister ? "注册" : "登录";
  toggleLink.textContent = isRegister ? "已有账号？登录" : "没有账号？注册";
  authMessage.textContent = "";
});

authSubmit.addEventListener("click", handleAuth);

// ---------- 聊天初始化 ----------
async function initChat() {
  // 清除旧的聊天记录（准备加载服务器数据）
  chatDiv.innerHTML = "";
  localStorage.removeItem("chatHistory");

  // 加载当前用户的历史消息
  const { data: messages, error } = await supabase
    .from("messages")
    .select("id, content, reply, created_at")
    .eq("user_id", currentUser.id)
    .order("created_at", { ascending: true });

  if (error) {
    console.error("加载历史消息失败:", error);
  } else if (messages) {
    messages.forEach(msg => {
      addMessage("user", msg.content);
      if (msg.reply) {
        addMessage("assistant", msg.reply);
      }
      // 保存到 localStorage 以便离线查看
      saveChatHistory("user", msg.content);
      if (msg.reply) saveChatHistory("assistant", msg.reply);
    });
  }

  // 启动轮询（每3秒检查是否有新回复）
  setInterval(pollReplies, 3000);
}

// 轮询未回复的消息
let pendingIds = [];

async function pollReplies() {
  if (!currentUser || pendingIds.length === 0) return;

  const { data, error } = await supabase
    .from("messages")
    .select("id, reply")
    .in("id", pendingIds)
    .not("reply", "is", null);

  if (error) return;

  data?.forEach(msg => {
    addMessage("assistant", msg.reply);
    saveChatHistory("assistant", msg.reply);
    pendingIds = pendingIds.filter(id => id !== msg.id);
  });
}

// 发送消息
async function sendMessage() {
  const text = textInput.value.trim();
  if (!text) return;

  const name = nameInput.value.trim() || currentUser?.email || "匿名访客";
  addMessage("user", text);
  saveChatHistory("user", text);
  textInput.value = "";

  const { data, error } = await supabase
    .from("messages")
    .insert([
      { 
        user_name: name, 
        content: text, 
        user_id: currentUser.id 
      }
    ])
    .select();

  if (error) {
    console.error("发送失败:", error);
    alert("发送失败：" + error.message);
    return;
  }

  // 记录这条消息的 id 用于轮询
  if (data && data[0]) {
    pendingIds.push(data[0].id);
  }
}

sendBtn.addEventListener("click", sendMessage);
textInput.addEventListener("keydown", e => {
  if (e.key === "Enter") sendMessage();
});

// ---------- 检查是否已经登录（session 恢复）----------
async function checkSession() {
  const { data: { session }, error } = await supabase.auth.getSession();
  if (session?.user) {
    currentUser = session.user;
    authArea.style.display = "none";
    chatArea.style.display = "block";
    initChat();
  } else {
    // 尝试从 localStorage 恢复聊天记录（离线显示）
    restoreChatHistory();
  }
}

checkSession();
</script>
</body>
</html>
