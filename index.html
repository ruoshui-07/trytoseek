<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrytoSeek - 互动聊天</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: auto; padding: 20px; background: #f0f2f5; }
        .container { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .header { text-align: center; margin-bottom: 20px; }
        .chat-box { height: 450px; overflow-y: auto; border: 1px solid #e8e8e8; border-radius: 8px; padding: 15px; margin-bottom: 15px; background: #fafafa; }
        .message { margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid #eee; }
        .meta { font-size: 12px; color: #888; }
        .content { margin: 6px 0; line-height: 1.6; }
        .reply { background: #e6f7ff; padding: 8px 12px; border-radius: 6px; margin-top: 8px; }
        .status { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; }
        .pending { background: #fffbe6; color: #faad14; }
        .replied { background: #e6fffb; color: #1890ff; }
        .auth-form { max-width: 380px; margin: 80px auto; text-align: center; }
        .auth-form input { width: 90%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; }
        .auth-form button { width: 96%; padding: 12px; background: #1890ff; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .hidden { display: none; }
        .input-area { display: flex; gap: 10px; }
        .input-area input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 6px; }
        .input-area button { padding: 12px 24px; background: #1890ff; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .toggle-auth { margin-top: 12px; color: #1890ff; cursor: pointer; font-size: 14px; }
        .error { color: red; font-size: 13px; margin-top: 8px; }
    </style>
</head>
<body>

<div id="authArea" class="auth-form">
    <h2>TrytoSeek</h2>
    <p>登录后即可开始聊天</p>
    <input id="authEmail" type="email" placeholder="邮箱">
    <input id="authPassword" type="password" placeholder="密码">
    <button id="authBtn">登录</button>
    <div class="toggle-auth" id="toggleText">没有账号？注册</div>
    <div class="error" id="authError"></div>
</div>

<div id="app" class="container hidden">
    <div class="header">
        <h3>欢迎，<span id="userEmail"></span></h3>
        <button onclick="signOut()" style="background:#999;color:white;border:none;padding:6px 16px;border-radius:4px;cursor:pointer;">退出</button>
    </div>
    <div class="chat-box" id="messages"></div>
    <div class="input-area">
        <input type="text" id="msgInput" placeholder="输入消息..." onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()">发送</button>
    </div>
</div>

<script>
    // ---- Supabase 配置 ----
    const SUPABASE_URL = 'https://verrithqsanxnhrtwjps.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlcnJpdGhxc2FueG5ocnR3anBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0OTc4MjMsImV4cCI6MjEwMjA3MzgyM30.pm8PZKgNyhQsExsu4vHT3BdbgP8bME8iA7nO8BXvle0';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ---- DOM 元素 ----
    const authArea = document.getElementById('authArea');
    const appDiv = document.getElementById('app');
    const authEmail = document.getElementById('authEmail');
    const authPassword = document.getElementById('authPassword');
    const authBtn = document.getElementById('authBtn');
    const toggleText = document.getElementById('toggleText');
    const authError = document.getElementById('authError');
    const userEmailSpan = document.getElementById('userEmail');
    const messagesDiv = document.getElementById('messages');
    const msgInput = document.getElementById('msgInput');

    let isRegister = false;
    let currentUser = null;

    // ---- 辅助函数 ----
    function showAuth() {
        authArea.classList.remove('hidden');
        appDiv.classList.add('hidden');
    }

    function showApp(user) {
        authArea.classList.add('hidden');
        appDiv.classList.remove('hidden');
        userEmailSpan.textContent = user.email;
        loadMessages();
    }

    // ---- 登录 / 注册 ----
    async function handleAuth() {
        const email = authEmail.value.trim();
        const password = authPassword.value.trim();
        if (!email || !password) {
            authError.textContent = '请填写邮箱和密码';
            return;
        }
        authError.textContent = '';
        authBtn.disabled = true;
        authBtn.textContent = '处理中...';

        try {
            let result;
            if (isRegister) {
                result = await supabase.auth.signUp({ email, password });
                if (result.error) throw result.error;
                // 注册成功后自动登录（需关闭 confirm email）
                await supabase.auth.signInWithPassword({ email, password });
            } else {
                result = await supabase.auth.signInWithPassword({ email, password });
                if (result.error) throw result.error;
            }

            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                currentUser = user;
                showApp(user);
            } else {
                authError.textContent = '登录失败，请稍后重试';
            }
        } catch (err) {
            authError.textContent = err.message;
        } finally {
            authBtn.disabled = false;
            authBtn.textContent = isRegister ? '注册' : '登录';
        }
    }

    // 切换登录/注册
    toggleText.addEventListener('click', () => {
        isRegister = !isRegister;
        authBtn.textContent = isRegister ? '注册' : '登录';
        toggleText.textContent = isRegister ? '已有账号？登录' : '没有账号？注册';
        authError.textContent = '';
    });

    authBtn.addEventListener('click', handleAuth);

    // 退出登录
    async function signOut() {
        await supabase.auth.signOut();
        location.reload();
    }

    // ---- 加载消息 ----
    async function loadMessages() {
        const { data, error } = await supabase
            .from('messages')
            .select('*')
            .order('created_at', { ascending: true });

        if (error) {
            console.error('加载消息失败:', error);
            return;
        }

        messagesDiv.innerHTML = '';
        data.forEach(msg => {
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `
                <div class="meta">${msg.user_name || '匿名'} · ${new Date(msg.created_at).toLocaleString()}</div>
                <div class="content">${escapeHtml(msg.content)}</div>
                ${msg.reply ? `<div class="reply"><strong>回复：</strong>${escapeHtml(msg.reply)}</div>` : '<span class="status pending">待回复</span>'}
            `;
            messagesDiv.appendChild(div);
        });
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ---- 发送消息 ----
    async function send() {
        const content = msgInput.value.trim();
        if (!content) return;

        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
            alert('登录已过期，请重新登录');
            showAuth();
            return;
        }

        const { error } = await supabase
            .from('messages')
            .insert([{ 
                user_name: user.email, 
                content: content, 
                user_id: user.id 
            }]);

        if (error) {
            alert('发送失败：' + error.message);
            return;
        }

        msgInput.value = '';
        loadMessages();
    }

    // ---- 自动轮询（每3秒检查新回复）----
    setInterval(loadMessages, 3000);

    // ---- 初始化：检查登录状态 ----
    (async function init() {
        const { data: { session } } = await supabase.auth.getSession();
        if (session?.user) {
            currentUser = session.user;
            showApp(session.user);
        } else {
            showAuth();
        }
    })();

    // 监听登录状态变化（多标签同步）
    supabase.auth.onAuthStateChange((event, session) => {
        if (session) {
            currentUser = session.user;
            showApp(session.user);
        } else {
            currentUser = null;
            showAuth();
        }
    });
</script>
</body>
</html>
