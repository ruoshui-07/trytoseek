<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>trytossek</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f7f7f8; }
    .header { text-align: center; padding: 20px; border-bottom: 1px solid #e5e5e5; background: white; }
    .header h1 { font-size: 24px; color: #202123; }
    .header p { color: #8e8ea0; font-size: 14px; margin-top: 6px; }
    .chat-container { max-width: 720px; margin: 0 auto; padding: 20px; }
    .message { margin-bottom: 20px; display: flex; }
    .message.user { justify-content: flex-end; }
    .message.assistant { justify-content: flex-start; }
    .bubble { max-width: 70%; padding: 12px 16px; border-radius: 18px; line-height: 1.5; }
    .message.user .bubble { background: #10a37f; color: white; border-bottom-right-radius: 4px; }
    .message.assistant .bubble { background: white; color: #202123; border: 1px solid #e5e5e5; border-bottom-left-radius: 4px; }
    .input-area { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e5e5e5; padding: 16px; }
    .input-box { max-width: 720px; margin: 0 auto; display: flex; gap: 10px; }
    .input-box input { flex: 1; padding: 12px 16px; border: 1px solid #d9d9e3; border-radius: 8px; font-size: 16px; outline: none; }
    .input-box input:focus { border-color: #10a37f; }
    .input-box button { padding: 12px 24px; background: #10a37f; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .input-box button:hover { background: #0d8a6a; }
    .input-box button:disabled { background: #a0a0a0; cursor: not-allowed; }
    .typing { color: #8e8ea0; font-style: italic; }
  </style>
</head>
<body>
  <div class="header">
    <h1>trytoseek</h1>
    <p>由 AI 驱动的领先聊天界面（*AI = Average Individual）</p>
  </div>

  <div class="chat-container" id="chatContainer">
    <div class="message assistant">
      <div class="bubble">你好！我是trytoseek，一个能工智人。问我任何问题，我会亲自回复你 <br><small>（注：能工智人需要休息和睡眠）</small></div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-box">
      <input type="text" id="userName" placeholder="你的昵称（可选）" style="flex: 0 0 150px;">
      <input type="text" id="userInput" placeholder="输入消息，回车发送...">
      <button id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
  </div>

  <!-- 库和脚本放在底部 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ====== 配置：替换成你自己的 Supabase 凭证 ======
    const SUPABASE_URL = 'https://verrithqsanxnhrtwjps.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlcnJpdGhxc2FueG5ocnR3anBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0OTc4MjMsImV4cCI6MjEwMjA3MzgyM30.pm8PZKgNyhQsExsu4vHT3BdbgP8bME8iA7nO8BXvle0';
    // ================================================

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let myMessages = [];
    let pollTimer = null;

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const nameInput = document.getElementById('userName');
      const text = input.value.trim();
      if (!text) return;

      const userName = nameInput.value.trim() || '匿名访客';
      
      addMessageToChat('user', text);
      input.value = '';
      document.getElementById('sendBtn').disabled = true;
      showTypingIndicator();

      const { data, error } = await supabase
        .from('messages')
        .insert([{ user_name: userName, content: text }])
        .select();

      if (error) {
        console.error('发送失败:', error);
        alert('发送失败，请重试');
        removeTypingIndicator();
        document.getElementById('sendBtn').disabled = false;
        return;
      }

      myMessages.push(data[0].id);
      removeTypingIndicator();
      document.getElementById('sendBtn').disabled = false;

      if (!pollTimer) {
        pollTimer = setInterval(pollReplies, 3000);
      }
    }

    async function pollReplies() {
      if (myMessages.length === 0) return;

      const { data, error } = await supabase
        .from('messages')
        .select('id, reply')
        .in('id', myMessages)
        .not('reply', 'is', null);

      if (error || !data) return;

      data.forEach(msg => {
        if (msg.reply) {
          addMessageToChat('assistant', msg.reply);
          myMessages = myMessages.filter(id => id !== msg.id);
        }
      });

      if (myMessages.length === 0 && pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    function addMessageToChat(role, text) {
      const container = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function showTypingIndicator() {
      const container = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = 'message assistant';
      div.id = 'typingIndicator';
      div.innerHTML = '<div class="bubble typing">🤖 正在输入...</div>';
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById('typingIndicator');
      if (indicator) indicator.remove();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById('userInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    window.addEventListener('load', () => {
      const saved = localStorage.getItem('myMessages');
      if (saved) {
        myMessages = JSON.parse(saved);
        if (myMessages.length > 0) {
          pollTimer = setInterval(pollReplies, 3000);
        }
      }
    });

    setInterval(() => {
      localStorage.setItem('myMessages', JSON.stringify(myMessages));
    }, 5000);
  </script>
</body>
</html>
