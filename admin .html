<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ChatTJB 管理后台</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f5f5f5;
}


.container{
    max-width:900px;
    margin:auto;
}


.login-box{

    background:white;
    padding:30px;
    border-radius:15px;
    max-width:400px;
    margin:100px auto;

}


input{

    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    margin:15px 0;

}


button{

    background:#10a37f;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;

}


.header{

    display:flex;
    justify-content:space-between;
    align-items:center;

}


.card{

    background:white;
    padding:20px;
    margin-top:15px;
    border-radius:12px;

}


.meta{

    color:#888;
    font-size:13px;

}


.message{

    margin:15px 0;
    font-size:16px;

}


textarea{

    width:100%;
    min-height:80px;
    padding:10px;
    border-radius:8px;
    border:1px solid #ddd;

}


.reply{

    margin-top:10px;

}


.done{

    color:#10a37f;

}


.pending{

    color:#f97316;

}


</style>

</head>



<body>


<div class="container">


<!-- 登录 -->

<div id="loginBox" class="login-box">

<h2>
🔐 管理员登录
</h2>


<input
id="passwordInput"
type="password"
placeholder="请输入管理员密码">


<button id="loginButton">
登录
</button>


</div>




<!-- 后台 -->


<div id="adminBox" style="display:none;">


<div class="header">

<h1>
🛠 ChatTJB 管理后台
</h1>


<button id="refreshButton">
刷新
</button>


</div>


<div id="messageList">

</div>


</div>



</div>





<script type="module">


import {
createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";



// =========================
// Supabase配置
// =========================


const SUPABASE_URL =
"https://verrithqsanxnhrtwjps.supabase.co";


const SUPABASE_KEY =
"nR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlcnJpdGhxc2FueG5ocnR3anBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0OTc4MjMsImV4cCI6MjEwMjA3MzgyM30.pm8PZKgNyhQsExsu4vHT3BdbgP8bME8iA7nO8BXvle0";



const supabase =
createClient(
SUPABASE_URL,
SUPABASE_KEY
);




// 管理密码

const ADMIN_PASSWORD =
"chattjb-admin";





// 获取元素

const loginBox =
document.getElementById("loginBox");


const adminBox =
document.getElementById("adminBox");


const passwordInput =
document.getElementById("passwordInput");


const loginButton =
document.getElementById("loginButton");


const messageList =
document.getElementById("messageList");



const refreshButton =
document.getElementById("refreshButton");





// 登录


loginButton.onclick=function(){


    if(
    passwordInput.value === ADMIN_PASSWORD
    ){


        loginBox.style.display="none";

        adminBox.style.display="block";


        loadMessages();


    }
    else{


        alert("密码错误");


    }



};







// 加载消息


async function loadMessages(){



const {
data,
error

}
=
await supabase

.from("messages")

.select("*")

.order(
"created_at",
{
ascending:false
}
);





if(error){


messageList.innerHTML =
"<p>数据库错误："+error.message+"</p>";


return;


}






messageList.innerHTML="";





data.forEach(
msg=>{


const card =
document.createElement("div");


card.className="card";



card.innerHTML=`


<div class="meta">

👤 ${msg.user_name || "匿名访客"}

<br>

🕒 ${new Date(msg.created_at).toLocaleString()}

</div>


<div class="message">

${msg.content}

</div>



${
msg.reply

?

`

<div class="done">

✅ 已回复：

${msg.reply}

</div>

`

:

`

<div class="pending">

⏳ 等待回复

</div>


<textarea id="reply-${msg.id}" placeholder="输入回复"></textarea>


<div class="reply">

<button data-id="${msg.id}">
发送回复
</button>

</div>

`

}



`;




messageList.appendChild(card);





if(!msg.reply){


card.querySelector("button")

.onclick=

()=>sendReply(msg.id);


}




});



}







// 回复


async function sendReply(id){



const textarea =
document.getElementById(
"reply-"+id
);



const text =
textarea.value.trim();



if(!text)return;




const {
error

}

=
await supabase

.from("messages")

.update({

reply:text,

replied_at:
new Date().toISOString()

})

.eq(
"id",
id
);





if(error){


alert(error.message);


return;


}



alert("回复成功");


loadMessages();



}






refreshButton.onclick=
loadMessages;





// 自动刷新

setInterval(
loadMessages,
5000
);



</script>


</body>

</html>
