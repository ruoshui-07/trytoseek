<!DOCTYPE html>

<html>


<head>

<meta charset="UTF-8">

<title>
管理员后台
</title>


<style>

body{
font-family:Arial;
padding:30px;
}


.card{

background:white;

padding:15px;

margin:10px;

box-shadow:0 2px 8px #ddd;

}


button{

background:#10a37f;

color:white;

border:0;

padding:8px;

}


</style>


</head>


<body>



<h1>
🔐 ChatTJB 管理后台
</h1>



<div id="login">


<input id="pwd"
type="password"
placeholder="管理员密码">


<button onclick="login()">
进入
</button>


</div>



<div id="app"
style="display:none">


<h2>
留言列表
</h2>


<div id="list">

</div>


</div>





<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>




<script>


const PASSWORD="chattjb-admin";




function login(){


if(
document.querySelector("#pwd").value
===PASSWORD
){


document.querySelector("#login")
.style.display="none";


document.querySelector("#app")
.style.display="block";


load();


}else{

alert("密码错误")

}


}





async function load(){


let {data,error}=

await supabaseClient

.from("messages")

.select("*")

.order(
"created_at",
{
ascending:false
}
);



if(error){

document.querySelector("#list")
.innerHTML=
error.message;

return;

}



let html="";


data.forEach(m=>{


html+=`

<div class="card">

<p>
${m.content}
</p>


<textarea id="r${m.id}">
${m.reply||""}
</textarea>


<br>


<button onclick="reply('${m.id}')">

回复

</button>


</div>

`;

});


document.querySelector("#list")
.innerHTML=html;



}



async function reply(id){


let text=
document.querySelector("#r"+id)
.value;



await supabaseClient

.from("messages")

.update({

reply:text

})

.eq(
"id",
id
);



alert("回复成功");


load();


}



setInterval(load,5000);



</script>


</body>


</html>
