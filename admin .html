<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>管理员后台</title>
<style>
body{font-family:Arial;padding:30px;}
.card{background:white;padding:15px;margin:10px;box-shadow:0 2px 8px #ddd;}
button{background:#10a37f;color:white;border:0;padding:8px;cursor:pointer;}
textarea{width:100%;min-height:60px;margin-top:8px;}
</style>
</head>
<body>
<h1>🔐 ChatTJB 管理后台</h1>

<div id="login">
<input id="pwd" type="password" placeholder="管理员密码">
<button onclick="login()">进入</button>
</div>

<div id="app" style="display:none">
<h2>留言列表</h2>
<div id="list"></div>
</div>

<!-- 使用稳定的 Supabase UMD 版本 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>

<script>
// ---------- Supabase 初始化 ----------
const SUPABASE_URL = "https://verrithqsanxnhrtwjps.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlcnJpdGhxc2FueG5ocnR3anBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0OTc4MjMsImV4cCI6MjEwMjA3MzgyM30.pm8PZKgNyhQsExsu4vHT3BdbgP8bME8iA7nO8BXvle0";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---------- 管理员密码 ----------
const PASSWORD = "chattjb-admin";

function login() {
    if (document.querySelector("#pwd").value === PASSWORD) {
        document.querySelector("#login").style.display = "none";
        document.querySelector("#app").style.display = "block";
        load();
    } else {
        alert("密码错误");
    }
}

// ---------- 安全构建留言卡片 ----------
async function load() {
    const { data, error } = await supabaseClient
        .from("messages")
        .select("*")
        .order("created_at", { ascending: false });

    const listDiv = document.querySelector("#list");
    listDiv.innerHTML = ""; // 清空

    if (error) {
        listDiv.textContent = error.message;
        return;
    }

    for (const msg of data) {
        const card = document.createElement("div");
        card.className = "card";

        // 内容段落（安全插入文本）
        const contentP = document.createElement("p");
        contentP.textContent = msg.content;
        card.appendChild(contentP);

        // 回复文本框
        const replyTA = document.createElement("textarea");
        replyTA.id = "r" + msg.id;
        replyTA.textContent = msg.reply || "";
        card.appendChild(replyTA);

        // 换行
        card.appendChild(document.createElement("br"));

        // 回复按钮
        const replyBtn = document.createElement("button");
        replyBtn.textContent = "回复";
        replyBtn.onclick = function() { reply(msg.id); };
        card.appendChild(replyBtn);

        listDiv.appendChild(card);
    }
}

// ---------- 回复操作 ----------
async function reply(id) {
    const text = document.querySelector("#r" + id).value;
    await supabaseClient
        .from("messages")
        .update({ reply: text })
        .eq("id", id);
    alert("回复成功");
    load();
}

// ---------- 自动轮询（每5秒刷新）----------
setInterval(load, 5000);
</script>
</body>
</html>
