<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ChatTJB 管理后台</title>


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;

background:#f5f5f5;

padding:20px;

}



.container{

max-width:900px;

margin:auto;

}



h1{

margin-bottom:20px;

color:#202123;

}



.login{

background:white;

padding:30px;

border-radius:12px;

max-width:400px;

margin:80px auto;

}



input{

width:100%;

padding:12px;

margin-top:10px;

border:1px solid #ddd;

border-radius:8px;

font-size:16px;

}



button{

padding:10px 18px;

background:#10a37f;

color:white;

border:none;

border-radius:8px;

cursor:pointer;

margin-top:10px;

}



.stats{

background:white;

padding:18px;

border-radius:10px;

margin-bottom:20px;

}



.message-item{

background:white;

padding:18px;

margin-bottom:15px;

border-radius:10px;

box-shadow:
0 2px 5px rgba(0,0,0,.08);

}



.meta{

font-size:13px;

color:#888;

margin-bottom:10px;

}



.content{

font-size:16px;

margin-bottom:15px;

}



textarea{

width:100%;

min-height:80px;

padding:10px;

border-radius:8px;

border:1px solid #ddd;

resize:vertical;

}



.reply{

margin-top:12px;

padding:12px;

background:#e9fff7;

border-radius:8px;

color:#087f5b;

}



.replied{

opacity:.7;

}



</style>


</head>


<body>



<div class="container">



<div id="loginBox" class="login">


<h2>
🔐 管理员登录
</h2>


<p style="margin-top:10px;color:#777">

请输入管理员密码

</p>


<input
id="password"
type="password"
placeholder="密码">


<button onclick="login()">

登录

</button>


</div>





<div id="adminPanel"
style="display:none">


<h1>
🛠 ChatTJB 管理后台
</h1>



<div class="stats" id="stats">

加载中...

</div>



<div id="messageList">

</div>



</div>



</div>







<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>




<script>


/*******************
 Supabase配置
*******************/



const SUPABASE_URL =
"https://verrithqsanxnhrtwjps.supabase.co";



const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlcnJpdGhxc2FueG5ocnR3anBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0OTc4MjMsImV4cCI6MjEwMjA3MzgyM30.pm8PZKgNyhQsExsu4vHT3BdbgP8bME8iA7nO8BXvle0";




const supabaseClient =
window.supabase.createClient(

SUPABASE_URL,

SUPABASE_ANON_KEY

);



console.log(
"Supabase连接成功"
);






const ADMIN_PASSWORD =
"chattjb-admin";






function login(){


let pass=
document.getElementById(
"password"
).value;



if(pass===ADMIN_PASSWORD){


document.getElementById(
"loginBox"
).style.display="none";



document.getElementById(
"adminPanel"
).style.display="block";



loadMessages();



setInterval(
loadMessages,
5000
);



}

else{


alert(
"密码错误"
);


}



}








async function loadMessages(){



const {

data,

error

}=await supabaseClient

.from("messages")

.select("*")

.order(
"created_at",
{
ascending:false
}

)

.limit(100);





if(error){


console.error(error);



document.getElementById(
"messageList"
).innerHTML=

"数据库读取失败："+error.message;



return;


}





renderMessages(data);



}








function renderMessages(messages){



let pending =
messages.filter(
m=>!m.reply
).length;



let replied =
messages.filter(
m=>m.reply
).length;





document.getElementById(
"stats"
).innerHTML=

`

<b>统计：</b>

待回复 ${pending} 条

&nbsp;|

已回复 ${replied} 条

&nbsp;|

总计 ${messages.length} 条

`;





let html="";





messages.forEach(m=>{



html+=`

<div class="message-item ${m.reply?'replied':''}">


<div class="meta">

👤 ${escapeHtml(m.user_name)}

<br>

🕒 ${new Date(
m.created_at
).toLocaleString(
"zh-CN"
)}

</div>



<div class="content">

${escapeHtml(m.content)}

</div>



${
m.reply

?

`

<div class="reply">

✅ 回复：

${escapeHtml(m.reply)}

</div>

`

:

`

<textarea
id="reply-${m.id}"
placeholder="输入回复内容">
</textarea>


<button onclick="reply('${m.id}')">

发送回复

</button>

`

}




</div>


`;



});





document.getElementById(
"messageList"
).innerHTML=html;



}










async function reply(id){



let textarea=
document.getElementById(
"reply-"+id
);



let text=
textarea.value.trim();




if(!text)
return;





const {

error

}=await supabaseClient

.from("messages")

.update({

reply:text,

replied_at:
new Date().toISOString()

})


.eq(
"id",
id
);






if(error){


alert(
"回复失败："+error.message
);


return;


}




alert(
"回复成功"
);



loadMessages();



}








function escapeHtml(text){



let div=
document.createElement(
"div"
);



div.textContent=
text || "";



return div.innerHTML;



}





</script>


</body>


</html>
