<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<title>ChatTJB 管理后台</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

body{

font-family:
Arial,
"Microsoft YaHei",
sans-serif;

background:#f5f5f5;

padding:20px;

}



.box{

background:white;

padding:25px;

border-radius:15px;

max-width:900px;

margin:auto;

}



input{

width:100%;

padding:12px;

margin:15px 0;

border:1px solid #ddd;

border-radius:8px;

}



button{

background:#10a37f;

color:white;

border:none;

padding:10px 20px;

border-radius:8px;

cursor:pointer;

}



.card{

background:#fff;

margin-top:15px;

padding:20px;

border-radius:12px;

box-shadow:0 2px 8px #ddd;

}



.time{

color:#888;

font-size:13px;

}



.content{

margin:15px 0;

font-size:16px;

}



textarea{

width:100%;

height:80px;

padding:10px;

}



.reply{

color:#10a37f;

}



.pending{

color:#f97316;

}


</style>


</head>



<body>


<div class="box">


<!-- 登录区域 -->

<div id="loginArea">


<h1>
🔐 管理员登录
</h1>


<input

id="password"

type="password"

placeholder="输入管理员密码">


<button id="loginBtn">

登录

</button>


</div>




<!-- 后台区域 -->


<div id="adminArea" style="display:none">


<h1>
🛠 ChatTJB 管理后台
</h1>


<button id="refreshBtn">

刷新

</button>


<div id="list">

</div>



</div>


</div>




<script type="module">


import {

createClient

}

from

"https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";




//================
// Supabase配置
//================


const URL =

"https://verrithqsanxnhrtwjps.supabase.co";



const KEY =

"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlcnJpdGhxc2FueG5ocnR3anBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0OTc4MjMsImV4cCI6MjEwMjA3MzgyM30.pm8PZKgNyhQsExsu4vHT3BdbgP8bME8iA7nO8BXvle0";



const supabase =

createClient(
URL,
KEY
);



//管理员密码

const ADMIN_PASSWORD =

"chattjb-admin";





//获取元素


const loginArea =
document.getElementById("loginArea");


const adminArea =
document.getElementById("adminArea");


const loginBtn =
document.getElementById("loginBtn");


const password =
document.getElementById("password");


const list =
document.getElementById("list");


const refreshBtn =
document.getElementById("refreshBtn");





//登录


loginBtn.onclick=function(){


if(password.value===ADMIN_PASSWORD){


loginArea.style.display="none";


adminArea.style.display="block";


loadMessages();


}

else{


alert("密码错误");


}


};







//读取消息


async function loadMessages(){



const result = await supabase

.from("messages")

.select("*")

.order(
"created_at",
{
ascending:false
}
);



if(result.error){


list.innerHTML =
"数据库错误："+result.error.message;


return;


}



list.innerHTML="";




result.data.forEach(function(msg){



let div =
document.createElement("div");



div.className="card";



let html="";



html +=

"<div class='time'>👤 "

+(msg.user_name || "匿名访客")

+"<br>🕒 "

+new Date(msg.created_at).toLocaleString()

+"</div>";



html +=

"<div class='content'>"

+escapeHtml(msg.content)

+"</div>";





if(msg.reply){


html +=

"<div class='reply'>"

+"✅ 回复："

+escapeHtml(msg.reply)

+"</div>";



}

else{



html +=

"<div class='pending'>"

+"⏳ 等待回复"

+"</div>";



html +=

"<textarea id='reply_"+msg.id+"' placeholder='输入回复'></textarea>";



html +=

"<br><br>";



html +=

"<button id='btn_"+msg.id+"'>

发送回复

</button>";



}



div.innerHTML=html;



list.appendChild(div);





if(!msg.reply){


document
.getElementById("btn_"+msg.id)
.onclick=function(){


sendReply(msg.id);


};


}




});




}







//发送回复


async function sendReply(id){



let text =

document
.getElementById("reply_"+id)
.value
.trim();



if(!text)return;



const result = await supabase

.from("messages")

.update({

reply:text,

replied_at:
new Date().toISOString()

})

.eq(
"id",
id
);



if(result.error){


alert(result.error.message);


return;


}



alert("回复成功");


loadMessages();



}







function escapeHtml(text){


let div=document.createElement("div");


div.innerText=text;


return div.innerHTML;


}





refreshBtn.onclick =
loadMessages;




//每5秒刷新

setInterval(
loadMessages,
5000
);



</script>


</body>

</html>
