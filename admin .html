<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ChatTJB 管理后台</title>
<style>
body{font-family:sans-serif;background:#f5f5f5;padding:20px}
.box,.item{background:white;padding:20px;border-radius:10px;margin-bottom:15px}
textarea{width:100%;height:70px}
button{background:#10a37f;color:white;border:0;padding:10px 18px;border-radius:8px}
</style>
</head>
<body>

<div id="login" class="box">
<h2>管理员登录</h2>
<input id="pwd" type="password" placeholder="密码">
<button onclick="login()">登录</button>
</div>

<div id="app" style="display:none">
<h1>ChatTJB 管理后台</h1>
<div id="list"></div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const URL="https://verrithqsanxnhrtwjps.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlcnJpdGhxc2FueG5ocnR3anBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0OTc4MjMsImV4cCI6MjEwMjA3MzgyM30.pm8PZKgNyhQsExsu4vHT3BdbgP8bME8iA7nO8BXvle0";
const db=createClient(URL,KEY);

function login(){
 if(document.getElementById("pwd").value==="chattjb-admin"){
  login.style.display="none";
  app.style.display="block";
  load();
 }else alert("密码错误");
}

window.login=login;

async function load(){
 let {data,error}=await db.from("messages").select("*").order("created_at",{ascending:false});
 if(error){list.innerHTML=error.message;return;}
 list.innerHTML=data.map(m=>`
 <div class="item">
 <p>${m.user_name}</p>
 <p>${m.content}</p>
 ${m.reply?`<p>✅ ${m.reply}</p>`:
 `<textarea id="r${m.id}"></textarea>
 <button onclick="reply('${m.id}')">回复</button>`}
 </div>`).join("");
}

async function reply(id){
 let t=document.getElementById("r"+id).value.trim();
 if(!t)return;
 await db.from("messages").update({reply:t,replied_at:new Date().toISOString()}).eq("id",id);
 load();
}

window.reply=reply;
setInterval(()=>{if(app.style.display==="block")load()},5000);
</script>

</body>
</html>
