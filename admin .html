<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>管理员后台</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
    <style>
        body { font-family: Arial; padding: 30px; background: #f5f5f5; max-width: 800px; margin: auto; }
        .card { background: white; padding: 18px; margin: 12px 0; border-radius: 8px; box-shadow: 0 2px 8px #ddd; }
        button { background: #10a37f; color: white; border: 0; padding: 8px 18px; border-radius: 6px; cursor: pointer; }
        textarea { width: 100%; min-height: 70px; margin: 8px 0; padding: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; }
        .auth-box { max-width: 360px; margin: 80px auto; background: white; padding: 28px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); text-align: center; }
        .auth-box input { width: 92%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; }
        .auth-box button { width: 98%; margin-top: 12px; }
        .hidden { display: none; }
        .error { color: red; font-size: 13px; margin-top: 8px; }
        .filter-bar { margin-bottom: 20px; }
        .filter-bar button { margin-right: 8px; background: #ccc; color: #333; }
        .filter-bar button.active { background: #10a37f; color: white; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; margin-left: 8px; }
        .badge-pending { background: #fff3cd; color: #856404; }
        .badge-replied { background: #d4edda; color: #155724; }
        .info { font-size: 12px; color: #888; }
    </style>
</head>
<body>

<div id="authArea" class="auth-box">
    <h2>管理员登录</h2>
    <input id="authEmail" type="email" placeholder="管理员邮箱">
    <input id="authPassword" type="password" placeholder="密码">
    <button id="authBtn">登录</button>
    <div class="error" id="authError"></div>
</div>

<div id="app" class="hidden">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h1>📋 留言管理</h1>
        <div>
            <span id="adminEmail"></span>
            <button onclick="signOut()" style="background:#e74c3c; margin-left:10px;">退出</button>
        </div>
    </div>

    <div class="filter-bar">
        <button class="active" data-filter="all">全部</button>
        <button data-filter="pending">待回复</button>
        <button data-filter="replied">已回复</button>
    </div>

    <div id="list"></div>
</div>

<script>
    // ---- Supabase 配置 ----
    const SUPABASE_URL = 'https://verrithqsanxnhrtwjps.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlcnJpdGhxc2FueG5ocnR3anBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0OTc4MjMsImV4cCI6MjEwMjA3MzgyM30.pm8PZKgNyhQsExsu4vHT3BdbgP8bME8iA7nO8BXvle0';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ---- DOM ----
    const authArea = document.getElementById('authArea');
    const appDiv = document.getElementById('app');
    const authEmail = document.getElementById('authEmail');
    const authPassword = document.getElementById('authPassword');
    const authBtn = document.getElementById('authBtn');
    const authError = document.getElementById('authError');
    const adminEmailSpan = document.getElementById('adminEmail');
    const listDiv = document.getElementById('list');
    const filterBtns = document.querySelectorAll('.filter-bar button');

    let currentUser = null;
    let allMessages = [];
    let currentFilter = 'all';

    // ---- 草稿保存 ----
    function saveDraft(id, value) {
        const drafts = JSON.parse(localStorage.getItem('adminDrafts') || '{}');
        drafts[id] = value;
        localStorage.setItem('adminDrafts', JSON.stringify(drafts));
    }

    function getDraft(id) {
        const drafts = JSON.parse(localStorage.getItem('adminDrafts') || '{}');
        return drafts[id] || '';
    }

    // ---- 登录 ----
    async function handleLogin() {
        const email = authEmail.value.trim();
        const password = authPassword.value.trim();
        if (!email || !password) {
            authError.textContent = '请填写邮箱和密码';
            return;
        }
        authError.textContent = '';
        authBtn.disabled = true;
        authBtn.textContent = '登录中...';

        try {
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;

            // 检查是否为管理员（通过 user_metadata 中的 role）
            const role = data.user?.user_metadata?.role;
            if (role !== 'admin') {
                // 尝试从 profiles 表读取（备用）
                const { data: profile } = await supabase
                    .from('profiles')
                    .select('role')
                    .eq('id', data.user.id)
                    .single()
                    .catch(() => ({ data: null }));
                if (profile?.role !== 'admin') {
                    await supabase.auth.signOut();
                    throw new Error('你不是管理员，无权访问');
                }
            }

            currentUser = data.user;
            authArea.classList.add('hidden');
            appDiv.classList.remove('hidden');
            adminEmailSpan.textContent = data.user.email;
            loadMessages();
        } catch (err) {
            authError.textContent = err.message;
        } finally {
            authBtn.disabled = false;
            authBtn.textContent = '登录';
        }
    }

    authBtn.addEventListener('click', handleLogin);

    async function signOut() {
        await supabase.auth.signOut();
        location.reload();
    }

    // ---- 加载消息 ----
    async function loadMessages() {
        const { data, error } = await supabase
            .from('messages')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            listDiv.innerHTML = `<p style="color:red">加载失败：${error.message}</p>`;
            return;
        }

        allMessages = data || [];
        renderList();
    }

    function renderList() {
        let filtered = allMessages;
        if (currentFilter === 'pending') {
            filtered = allMessages.filter(m => !m.reply);
        } else if (currentFilter === 'replied') {
            filtered = allMessages.filter(m => m.reply);
        }

        listDiv.innerHTML = '';
        if (filtered.length === 0) {
            listDiv.innerHTML = '<p>暂无留言</p>';
            return;
        }

        filtered.forEach(msg => {
            const card = document.createElement('div');
            card.className = 'card';

            // 用户信息
            const info = document.createElement('div');
            info.className = 'info';
            info.textContent = `${msg.user_name || '匿名'} · ${new Date(msg.created_at).toLocaleString()}`;
            card.appendChild(info);

            // 内容
            const contentP = document.createElement('p');
            contentP.textContent = msg.content;
            card.appendChild(contentP);

            // 状态标签
            const badge = document.createElement('span');
            badge.className = 'badge ' + (msg.reply ? 'badge-replied' : 'badge-pending');
            badge.textContent = msg.reply ? '已回复' : '待回复';
            card.appendChild(badge);

            // 回复文本框
            const replyTA = document.createElement('textarea');
            replyTA.id = 'r' + msg.id;
            replyTA.value = getDraft(msg.id) || msg.reply || '';
            replyTA.addEventListener('input', () => saveDraft(msg.id, replyTA.value));
            card.appendChild(replyTA);

            // 回复按钮
            const replyBtn = document.createElement('button');
            replyBtn.textContent = '回复';
            replyBtn.onclick = async () => {
                const text = replyTA.value.trim();
                if (!text) {
                    alert('请输入回复内容');
                    return;
                }
                replyBtn.disabled = true;
                replyBtn.textContent = '保存中...';

                const { error } = await supabase
                    .from('messages')
                    .update({ reply: text })
                    .eq('id', msg.id);

                if (error) {
                    alert('回复失败：' + error.message);
                    replyBtn.disabled = false;
                    replyBtn.textContent = '回复';
                    return;
                }

                saveDraft(msg.id, ''); // 清除草稿
                alert('回复成功');
                loadMessages();
            };
            card.appendChild(replyBtn);

            listDiv.appendChild(card);
        });
    }

    // ---- 筛选切换 ----
    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            filterBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            renderList();
        });
    });

    // ---- 自动轮询（每10秒）----
    setInterval(loadMessages, 10000);

    // ---- 初始化 ----
    (async function init() {
        const { data: { session } } = await supabase.auth.getSession();
        if (session?.user) {
            const role = session.user?.user_metadata?.role;
            if (role === 'admin') {
                currentUser = session.user;
                authArea.classList.add('hidden');
                appDiv.classList.remove('hidden');
                adminEmailSpan.textContent = session.user.email;
                loadMessages();
            } else {
                authError.textContent = '你不是管理员，请使用管理员账号登录';
            }
        }
    })();
</script>
</body>
</html>
