<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>管理员后台</title>
<style>
body{font-family:Arial;padding:30px;background:#f5f5f5}
.card{background:white;padding:15px;margin:10px;box-shadow:0 2px 8px #ddd;border-radius:8px}
button{background:#10a37f;color:white;border:0;padding:8px 16px;border-radius:6px;cursor:pointer}
textarea{width:100%;min-height:60px;margin-top:8px;padding:8px;box-sizing:border-box}
.auth-box{max-width:400px;margin:40px auto;padding:20px;background:white;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,0.1)}
.auth-box h2{text-align:center}
.auth-box input{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:6px;box-sizing:border-box}
.auth-box button{width:100%;margin-top:10px}
.toggle-link{text-align:center;margin-top:12px;color:#10a37f;cursor:pointer}
#filter{margin-bottom:20px}
#filter button{margin-right:8px;background:#ccc;color:#333}
#filter button.active{background:#10a37f;color:white}
.status-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:12px;margin-left:8px}
.badge-pending{background:#fff3cd;color:#856404}
.badge-replied{background:#d4edda;color:#155724}
</style>
</head>
<body>
<h1>🔐 ChatTJB 管理后台</h1>

<!-- 登录区域 -->
<div id="authArea" class="auth-box">
  <h2>管理员登录</h2>
  <input id="authEmail" type="email" placeholder="管理员邮箱">
  <input id="authPassword" type="password" placeholder="密码">
  <button id="authSubmit">登录</button>
  <div id="authMessage" style="color:red;margin-top:8px"></div>
</div>

<!-- 管理面板（初始隐藏） -->
<div id="app" style="display:none">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
    <span>欢迎，<span id="adminEmail"></span></span>
    <button id="logoutBtn" style="background:#e74c3c">退出</button>
  </div>
  <div id="filter">
    <button class="active" data-filter="all">全部</button>
    <button data-filter="pending">待回复</button>
    <button data-filter="replied">已回复</button>
  </div>
  <div id="list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://verrithqsanxnhrtwjps.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlcnJpdGhxc2FueG5ocnR3anBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0OTc4MjMsImV4cCI6MjEwMjA3MzgyM30.pm8PZKgNyhQsExsu4vHT3BdbgP8bME8iA7nO8BXvle0";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---------- DOM ----------
const authArea = document.getElementById("authArea");
const appDiv = document.getElementById("app");
const authEmail = document.getElementById("authEmail");
const authPassword = document.getElementById("authPassword");
const authSubmit = document.getElementById("authSubmit");
const authMessage = document.getElementById("authMessage");
const adminEmailSpan = document.getElementById("adminEmail");
const logoutBtn = document.getElementById("logoutBtn");
const filterBtns = document.querySelectorAll("#filter button");
const listDiv = document.getElementById("list");

let currentUser = null;
let allMessages = [];
let currentFilter = "all";

// ---------- 草稿保存 ----------
function saveDraft(id, value) {
  const drafts = JSON.parse(localStorage.getItem("adminDrafts") || "{}");
  drafts[id] = value;
  localStorage.setItem("adminDrafts", JSON.stringify(drafts));
}

function getDraft(id) {
  const drafts = JSON.parse(localStorage.getItem("adminDrafts") || "{}");
  return drafts[id] || "";
}

// ---------- 登录 ----------
async function handleLogin() {
  const email = authEmail.value.trim();
  const password = authPassword.value.trim();
  if (!email || !password) {
    authMessage.textContent = "请填写邮箱和密码";
    return;
  }
  authMessage.textContent = "";
  authSubmit.disabled = true;
  authSubmit.textContent = "登录中...";

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) {
    authMessage.textContent = error.message;
    authSubmit.disabled = false;
    authSubmit.textContent = "登录";
    return;
  }

  // 检查是否是管理员（通过 user_metadata 中的 role）
  const user = data.user;
  const role = user?.user_metadata?.role;
  if (role !== "admin") {
    // 如果没有 role，尝试从数据库读取（需要提前设置）
    const { data: profile } = await supabase
      .from("profiles")
      .select("role")
      .eq("id", user.id)
      .single()
      .catch(() => ({ data: null }));
    
    if (profile?.role !== "admin") {
      await supabase.auth.signOut();
      authMessage.textContent = "你不是管理员，无权访问";
      authSubmit.disabled = false;
      authSubmit.textContent = "登录";
      return;
    }
  }

  currentUser = user;
  authArea.style.display = "none";
  appDiv.style.display = "block";
  adminEmailSpan.textContent = user.email;
  loadMessages();
}

authSubmit.addEventListener("click", handleLogin);

// 退出登录
logoutBtn.addEventListener("click", async () => {
  await supabase.auth.signOut();
  location.reload();
});

// ---------- 加载消息 ----------
async function loadMessages() {
  const { data, error } = await supabase
    .from("messages")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    listDiv.innerHTML = `<p style="color:red">加载失败：${error.message}</p>`;
    return;
  }

  allMessages = data || [];
  renderList();
}

// ---------- 渲染列表 ----------
function renderList() {
  let filtered = allMessages;
  if (currentFilter === "pending") {
    filtered = allMessages.filter(m => !m.reply);
  } else if (currentFilter === "replied") {
    filtered = allMessages.filter(m => m.reply);
  }

  listDiv.innerHTML = "";
  if (filtered.length === 0) {
    listDiv.innerHTML = "<p>暂无留言</p>";
    return;
  }

  filtered.forEach(msg => {
    const card = document.createElement("div");
    card.className = "card";

    // 用户信息
    const info = document.createElement("div");
    info.style.fontSize = "12px";
    info.style.color = "#666";
    info.textContent = `${msg.user_name || "匿名"} · ${new Date(msg.created_at).toLocaleString()}`;
    card.appendChild(info);

    // 内容
    const contentP = document.createElement("p");
    contentP.textContent = msg.content;
    card.appendChild(contentP);

    // 状态标签
    const badge = document.createElement("span");
    badge.className = "status-badge " + (msg.reply ? "badge-replied" : "badge-pending");
    badge.textContent = msg.reply ? "已回复" : "待回复";
    card.appendChild(badge);

    // 回复文本框
    const replyTA = document.createElement("textarea");
    replyTA.id = "r" + msg.id;
    // 从 localStorage 恢复草稿，优先于服务器数据
    const draft = getDraft(msg.id);
    replyTA.value = draft || msg.reply || "";
    // 监听输入变化保存草稿
    replyTA.addEventListener("input", () => saveDraft(msg.id, replyTA.value));
    card.appendChild(replyTA);

    // 回复按钮
    const replyBtn = document.createElement("button");
    replyBtn.textContent = "回复";
    replyBtn.onclick = async () => {
      const text = replyTA.value.trim();
      if (!text) {
        alert("请输入回复内容");
        return;
      }
      replyBtn.disabled = true;
      replyBtn.textContent = "保存中...";

      const { error } = await supabase
        .from("messages")
        .update({ reply: text })
        .eq("id", msg.id);

      if (error) {
        alert("回复失败：" + error.message);
        replyBtn.disabled = false;
        replyBtn.textContent = "回复";
        return;
      }

      // 保存成功后清除草稿
      saveDraft(msg.id, "");
      alert("回复成功");
      loadMessages(); // 刷新列表
    };
    card.appendChild(replyBtn);

    listDiv.appendChild(card);
  });
}

// ---------- 筛选切换 ----------
filterBtns.forEach(btn => {
  btn.addEventListener("click", () => {
    filterBtns.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    renderList();
  });
});

// ---------- 自动轮询（每10秒）----------
setInterval(loadMessages, 10000);

// ---------- 检查 session ----------
(async function init() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session?.user) {
    const user = session.user;
    const role = user?.user_metadata?.role;
    if (role === "admin") {
      currentUser = user;
      authArea.style.display = "none";
      appDiv.style.display = "block";
      adminEmailSpan.textContent = user.email;
      loadMessages();
    } else {
      // 如果不是管理员，留在登录页
      authMessage.textContent = "你不是管理员，请使用管理员账号登录";
    }
  }
})();
</script>
</body>
</html>
